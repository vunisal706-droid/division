<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="apple-mobile-web-app-title" content="División Quest">
    <meta name="theme-color" content="#D4A574">
    <meta name="description" content="Juego educativo de divisiones para 4º-6º de primaria">
    <title>División Quest - Aventura Egipcia</title>
    <link rel="manifest" href="manifest_division.json">
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #D4A574 0%, #8B6914 100%);
            font-family: 'Andika', 'Comic Sans MS', cursive;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        #gameCanvas {
            border-radius: 8px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1000" height="700"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resolución lógica del juego (todas las coordenadas usan este sistema)
        const LOGICAL_W = 1000, LOGICAL_H = 700;

        // Renderizado nítido en pantallas de alta densidad
        function setupCanvasDPR() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = LOGICAL_W * dpr;
            canvas.height = LOGICAL_H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        setupCanvasDPR();
        window.addEventListener('resize', setupCanvasDPR);

        // Sistema de audio
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(freq1, freq2, duration) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(freq1, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(freq2, audioContext.currentTime + duration * 0.5);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        // Datos del juego
        const gameData = {
            coins: 0,
            lives: 3,
            currentLevel: 1,
            unlockedLevels: 1,
            currentExplorer: 'classic',
            ownedExplorers: ['classic'],
            divisionsCorrect: 0,
            scene: 'menu'
        };

        // Divisiones por nivel
        const levelDivisions = {
            1: [[10,2],[12,3],[15,3],[20,4],[16,4],[18,3],[21,7],[24,6],[27,9],[30,5]],
            2: [[24,4],[32,8],[36,6],[40,5],[45,9],[48,6],[54,9],[56,7],[63,9],[72,8]],
            3: [[42,6],[49,7],[56,8],[64,8],[81,9],[35,7],[28,4],[48,8],[63,7],[36,4]],
            4: [[84,7],[96,8],[72,6],[60,5],[88,8],[77,7],[90,9],[66,6],[55,5],[99,9]],
            5: [[144,12],[156,13],[132,11],[168,14],[180,15],[120,10],[165,15],[143,11],[169,13],[192,16]],
            6: [[225,15],[240,16],[210,14],[270,18],[300,20],[195,13],[264,12],[288,16],[336,21],[252,14]],
            7: [[25,4],[30,7],[45,8],[50,6],[37,5],[41,6],[53,7],[62,8],[71,9],[83,10]],
            8: [[95,12],[110,13],[125,14],[140,15],[156,17],[173,18],[189,19],[205,20],[221,21],[237,22]],
            9: [[300,23],[350,24],[400,27],[450,31],[500,33],[550,37],[600,41],[650,43],[700,47],[750,49]]
        };

        // Divisiones EXACTAS para el cofre del tesoro (una por nivel)
        const chestDivisions = {
            1: [48, 4],     // = 12
            2: [100, 5],    // = 20
            3: [150, 6],    // = 25
            4: [210, 7],    // = 30
            5: [256, 8],    // = 32
            6: [288, 9],    // = 32
            7: [350, 10],   // = 35
            8: [440, 11],   // = 40
            9: [480, 12]    // = 40
        };

        // Exploradores
        const explorers = [
            { name: 'Clásico', id: 'classic', price: 0 },
            { name: 'Indiana', id: 'indiana', price: 8 },
            { name: 'Arqueóloga', id: 'archaeologist', price: 8 },
            { name: 'Aventurero', id: 'adventurer', price: 8 },
            { name: 'Faraón', id: 'pharaoh', price: 10 },
            { name: 'Cleopatra', id: 'cleopatra', price: 10 },
            { name: 'Anubis', id: 'anubis', price: 12 }
        ];

        // Player
        const player = {
            x: 100, y: 500,
            width: 60, height: 75,
            velocityX: 0, velocityY: 0,
            speed: 6, jumpPower: 16, gravity: 0.6,
            onGround: false, invincible: false, invincibleTimer: 0
        };

        const PLAYER_SCALE = 1.5;

        // Game state
        let currentDivisions = [];
        let temples = [];
        let scorpions = [];
        let traps = [];
        let mummy = null;
        let treasureChest = null;
        let cameraX = 0;
        let showingKeypad = false;
        let currentTemple = null;
        let playerAnswer = '';
        let gameTime = 0;
        let isChestQuestion = false; // Para saber si la pregunta es del cofre

        // Input
        const keys = {};
        let touchLeft = false;
        let touchRight = false;
        let touchJump = false;
        let activeTouches = {};

        // Zonas de controles
        const controlZones = {
            left: { cx: 100, cy: 620, r: 55 },
            jump: { cx: 220, cy: 620, r: 55 },
            right: { cx: 340, cy: 620, r: 55 }
        };

        // ============ EVENTOS DE INPUT ============
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (showingKeypad && /^[0-9]$/.test(e.key)) {
                if (playerAnswer.length < 5) playerAnswer += e.key;
            }
            if (showingKeypad && e.key === 'Backspace') {
                playerAnswer = playerAnswer.slice(0, -1);
            }
            if (showingKeypad && e.key === 'Enter') {
                submitAnswer();
            }
        });

        document.addEventListener('keyup', (e) => keys[e.key] = false);

        // Función para obtener coordenadas del canvas
        // El canvas usa object-fit: contain, así que el dibujo queda centrado
        // dentro del elemento con bandas: hay que descontarlas para que el
        // toque coincida con lo que se ve en pantalla.
        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scale = Math.min(rect.width / LOGICAL_W, rect.height / LOGICAL_H);
            const contentW = LOGICAL_W * scale;
            const contentH = LOGICAL_H * scale;
            const offsetX = rect.left + (rect.width - contentW) / 2;
            const offsetY = rect.top + (rect.height - contentH) / 2;
            return {
                x: (clientX - offsetX) / scale,
                y: (clientY - offsetY) / scale
            };
        }

        // ============ PANTALLA COMPLETA (móvil) ============
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        function goFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) return;
            const el = document.documentElement;
            const req = el.requestFullscreen || el.webkitRequestFullscreen;
            if (req) {
                try {
                    const p = req.call(el);
                    if (p && p.catch) p.catch(() => {});
                } catch (e) {}
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        // MOUSE
        canvas.addEventListener('mousedown', (e) => {
            const coords = getCanvasCoords(e.clientX, e.clientY);
            handleInteraction(coords.x, coords.y, 'mouse');
        });

        canvas.addEventListener('mouseup', () => {
            delete activeTouches['mouse'];
            updateTouchControls();
        });

        canvas.addEventListener('mouseleave', () => {
            delete activeTouches['mouse'];
            updateTouchControls();
        });

        // TOUCH
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            goFullscreen();
            for (let touch of e.changedTouches) {
                const coords = getCanvasCoords(touch.clientX, touch.clientY);
                handleInteraction(coords.x, coords.y, touch.identifier);
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                const coords = getCanvasCoords(touch.clientX, touch.clientY);
                if (activeTouches[touch.identifier] && gameData.scene === 'game' && !showingKeypad) {
                    activeTouches[touch.identifier].x = coords.x;
                    activeTouches[touch.identifier].y = coords.y;
                    checkControlZone(coords.x, coords.y, touch.identifier);
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                delete activeTouches[touch.identifier];
            }
            updateTouchControls();
        });

        canvas.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                delete activeTouches[touch.identifier];
            }
            updateTouchControls();
        });

        function handleInteraction(x, y, touchId) {
            // Si estamos en el keypad, solo manejar clicks en botones
            if (showingKeypad) {
                handleKeypadClick(x, y);
                return;
            }

            // Si estamos en el juego, verificar controles
            if (gameData.scene === 'game') {
                activeTouches[touchId] = { x, y, control: null, jumpUsed: false };
                checkControlZone(x, y, touchId);
            }

            // Manejar clicks en botones de UI
            handleClick(x, y);
        }

        function checkControlZone(x, y, touchId) {
            if (showingKeypad) return;
            
            let control = null;
            if (dist(x, y, controlZones.left.cx, controlZones.left.cy) < controlZones.left.r) {
                control = 'left';
            } else if (dist(x, y, controlZones.jump.cx, controlZones.jump.cy) < controlZones.jump.r) {
                control = 'jump';
            } else if (dist(x, y, controlZones.right.cx, controlZones.right.cy) < controlZones.right.r) {
                control = 'right';
            }

            if (activeTouches[touchId]) {
                activeTouches[touchId].control = control;
            }
            updateTouchControls();
        }

        function dist(x1, y1, x2, y2) {
            return Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1));
        }

        function updateTouchControls() {
            touchLeft = false;
            touchRight = false;

            for (let id in activeTouches) {
                const touch = activeTouches[id];
                if (touch.control === 'left') touchLeft = true;
                if (touch.control === 'right') touchRight = true;
                if (touch.control === 'jump' && !touch.jumpUsed) {
                    touchJump = true;
                    touch.jumpUsed = true;
                    setTimeout(() => touchJump = false, 100);
                }
            }
        }

        // ============ FUNCIONES DE DIBUJO ============
        function drawRect(x, y, w, h, color, stroke = null, radius = 0) {
            ctx.fillStyle = color;
            if (radius > 0) {
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, radius);
                ctx.fill();
                if (stroke) {
                    ctx.strokeStyle = stroke;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            } else {
                ctx.fillRect(x, y, w, h);
                if (stroke) {
                    ctx.strokeStyle = stroke;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, w, h);
                }
            }
        }

        function drawCircle(x, y, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawText(text, x, y, size, color, align = 'left', stroke = false) {
            ctx.font = `bold ${size}px Andika, Arial, sans-serif`;
            ctx.fillStyle = color;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            if (stroke) {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.strokeText(text, x, y);
            }
            ctx.fillText(text, x, y);
        }

        function drawButton(x, y, w, h, text, color, textSize = 20) {
            // Sombra
            drawRect(x + 3, y + 3, w, h, 'rgba(0,0,0,0.4)', null, 10);
            // Botón
            drawRect(x, y, w, h, color, '#fff', 10);
            drawText(text, x + w/2, y + h/2, textSize, '#fff', 'center');
            return { x, y, w, h };
        }

        // ============ DIBUJAR PIRÁMIDE ============
        function drawPyramid(x, y, solved) {
            const baseWidth = 120, height = 100;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.moveTo(x - baseWidth/2 + 5, y + 5);
            ctx.lineTo(x + baseWidth/2 + 5, y + 5);
            ctx.lineTo(x + 5, y - height + 5);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = solved ? '#90EE90' : '#D2B48C';
            ctx.beginPath();
            ctx.moveTo(x - baseWidth/2, y);
            ctx.lineTo(x + baseWidth/2, y);
            ctx.lineTo(x, y - height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = solved ? '#7CCD7C' : '#C9A876';
            ctx.beginPath();
            ctx.moveTo(x - baseWidth/2, y);
            ctx.lineTo(x, y - height);
            ctx.lineTo(x, y);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = solved ? '#98FB98' : '#DEB887';
            ctx.beginPath();
            ctx.moveTo(x + baseWidth/2, y);
            ctx.lineTo(x, y - height);
            ctx.lineTo(x, y);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#8B7355';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x - baseWidth/2, y);
            ctx.lineTo(x + baseWidth/2, y);
            ctx.lineTo(x, y - height);
            ctx.closePath();
            ctx.stroke();

            if (!solved) {
                ctx.strokeStyle = '#A0826D';
                ctx.lineWidth = 2;
                for (let i = 1; i < 5; i++) {
                    const yPos = y - (height / 5) * i;
                    const widthAtLevel = baseWidth * (1 - i / 5);
                    ctx.beginPath();
                    ctx.moveTo(x - widthAtLevel/2, yPos);
                    ctx.lineTo(x + widthAtLevel/2, yPos);
                    ctx.stroke();
                }
                drawEgyptianSymbol(x, y - height/2);
            } else {
                ctx.fillStyle = '#2E7D32';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('✓', x, y - height/2);
            }
        }

        function drawEgyptianSymbol(x, y) {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(x, y, 18, 22, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x, y - 18, 10, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(x, y, 18, 22, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawScorpion(x, y, dir = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(dir, 1);
            const t = gameTime * 0.25;

            // Patas articuladas (4 por lado, animadas)
            ctx.strokeStyle = '#5C3317';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            for (let i = 0; i < 4; i++) {
                const lx = -11 + i * 7;
                const sw = Math.sin(t + i * 1.5) * 3;
                ctx.beginPath();
                ctx.moveTo(lx, 2);
                ctx.quadraticCurveTo(lx - 5 + sw, 8, lx - 8 + sw, 14);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(lx, 2);
                ctx.quadraticCurveTo(lx + 6 - sw, 8, lx + 4 - sw, 14);
                ctx.stroke();
            }

            // Cola segmentada curvada hacia arriba
            const sway = Math.sin(t * 0.8) * 2;
            const seg = [
                { x: -16, y: -2, r: 6 },
                { x: -24, y: -8, r: 5.5 },
                { x: -29, y: -16, r: 5 },
                { x: -30, y: -24 + sway, r: 4.5 },
                { x: -27, y: -31 + sway, r: 4 }
            ];
            seg.forEach((s, i) => {
                ctx.fillStyle = i % 2 === 0 ? '#6B3410' : '#7E4318';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
            // Aguijón
            const tip = seg[4];
            ctx.fillStyle = '#3B1F0B';
            ctx.beginPath();
            ctx.moveTo(tip.x - 2, tip.y - 3);
            ctx.quadraticCurveTo(tip.x + 8, tip.y - 11, tip.x + 11, tip.y - 3);
            ctx.quadraticCurveTo(tip.x + 5, tip.y - 5, tip.x - 2, tip.y + 2);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#E53935';
            ctx.beginPath();
            ctx.arc(tip.x + 10, tip.y - 4, 2.2, 0, Math.PI * 2);
            ctx.fill();

            // Pinza trasera (más oscura, detrás del cuerpo)
            drawScorpionClaw(20, -7, t, true);

            // Cuerpo (abdomen segmentado con volumen)
            const bodyGrad = ctx.createLinearGradient(0, -9, 0, 8);
            bodyGrad.addColorStop(0, '#8A4B1F');
            bodyGrad.addColorStop(1, '#4A2511');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.ellipse(-2, 0, 16, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.lineWidth = 1.5;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(-2 + i * 6, -7);
                ctx.quadraticCurveTo(-4 + i * 6, 0, -2 + i * 6, 7);
                ctx.stroke();
            }
            // Brillo superior
            ctx.fillStyle = 'rgba(255,220,170,0.25)';
            ctx.beginPath();
            ctx.ellipse(-3, -4, 10, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cabeza
            ctx.fillStyle = '#6B3410';
            ctx.beginPath();
            ctx.ellipse(13, -1, 7, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            // Ojos
            ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.arc(14, -4, 2.6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.arc(15, -4, 1.3, 0, Math.PI * 2); ctx.fill();
            // Ceño enfadado
            ctx.strokeStyle = '#2E1505';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(11, -8); ctx.lineTo(17, -6);
            ctx.stroke();

            // Pinza delantera
            drawScorpionClaw(23, 5, t, false);

            ctx.restore();
        }

        function drawScorpionClaw(px, py, t, dark) {
            const pinch = Math.sin(t) * 2;
            // Brazo
            ctx.strokeStyle = dark ? '#5C3317' : '#7E4318';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(12, py * 0.4);
            ctx.quadraticCurveTo(18, py - 2, px - 4, py);
            ctx.stroke();
            // Palma
            ctx.fillStyle = dark ? '#5C3317' : '#8A4B1F';
            ctx.beginPath();
            ctx.ellipse(px + 2, py, 6.5, 5, -0.15, 0, Math.PI * 2);
            ctx.fill();
            // Dedos de la pinza (abren y cierran)
            ctx.fillStyle = dark ? '#4A2511' : '#6B3410';
            ctx.beginPath();
            ctx.moveTo(px + 5, py - 3);
            ctx.quadraticCurveTo(px + 14, py - 7 - pinch, px + 13, py - 1);
            ctx.quadraticCurveTo(px + 9, py - 3, px + 5, py - 1);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(px + 5, py + 3);
            ctx.quadraticCurveTo(px + 14, py + 7 + pinch, px + 13, py + 1);
            ctx.quadraticCurveTo(px + 9, py + 3, px + 5, py + 1);
            ctx.closePath();
            ctx.fill();
        }

        function drawTrap(x, y, extended) {
            const height = extended ? 40 : 10;
            ctx.fillStyle = '#654321';
            ctx.fillRect(x - 30, y, 60, 10);
            ctx.fillStyle = '#B87333';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(x - 25 + i * 12, y);
                ctx.lineTo(x - 20 + i * 12, y - height);
                ctx.lineTo(x - 15 + i * 12, y);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawMummy(x, y) {
            const t = gameTime * 0.15;
            const bob = Math.sin(t) * 2;
            ctx.save();
            ctx.translate(0, bob);
            // Piernas arrastrando
            ctx.fillStyle = '#E8E4D0';
            ctx.fillRect(x - 12, y + 8, 9, 22);
            ctx.fillRect(x + 3, y + 8, 9, 22);
            // Cuerpo redondeado
            ctx.fillStyle = '#F1EDDA';
            ctx.beginPath();
            ctx.moveTo(x - 16, y - 34);
            ctx.quadraticCurveTo(x - 20, y - 10, x - 15, y + 10);
            ctx.lineTo(x + 15, y + 10);
            ctx.quadraticCurveTo(x + 20, y - 10, x + 16, y - 34);
            ctx.quadraticCurveTo(x, y - 46, x - 16, y - 34);
            ctx.closePath();
            ctx.fill();
            // Brazos extendidos hacia delante (¡uuuh!)
            ctx.fillStyle = '#E8E4D0';
            ctx.save();
            ctx.translate(x, y - 22);
            ctx.rotate(Math.sin(t) * 0.08 - 0.1);
            ctx.fillRect(-32, -4, 26, 9);
            ctx.restore();
            ctx.save();
            ctx.translate(x, y - 12);
            ctx.rotate(-Math.sin(t) * 0.08 + 0.08);
            ctx.fillRect(-34, -4, 26, 9);
            ctx.restore();
            // Vendas cruzadas
            ctx.strokeStyle = '#CFC9AE';
            ctx.lineWidth = 2.5;
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(x - 17, y - 32 + i * 8);
                ctx.quadraticCurveTo(x, y - 28 + i * 8, x + 17, y - 34 + i * 8);
                ctx.stroke();
            }
            // Vendas sueltas ondeando
            ctx.strokeStyle = '#E8E4D0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x + 14, y - 36);
            ctx.quadraticCurveTo(x + 24, y - 32 + Math.sin(t * 2) * 4, x + 30, y - 26 + Math.sin(t * 2) * 6);
            ctx.stroke();
            // Ojos rojos brillantes entre las vendas
            ctx.fillStyle = '#2B2B2B';
            ctx.fillRect(x - 12, y - 40, 24, 9);
            ctx.fillStyle = '#FF3B30';
            ctx.beginPath();
            ctx.arc(x - 5, y - 35.5, 3.2, 0, Math.PI * 2);
            ctx.arc(x + 6, y - 35.5, 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFB3AE';
            ctx.beginPath();
            ctx.arc(x - 4, y - 36.5, 1.1, 0, Math.PI * 2);
            ctx.arc(x + 7, y - 36.5, 1.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawTreasureChest(x, y, locked) {
            const w = 60, h = 40;
            ctx.fillStyle = '#654321';
            ctx.fillRect(x - w/2, y - h/2, w, h);
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x - w/2 + 5, y - h/2 + 5, w - 10, h - 10);
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3;
            ctx.strokeRect(x - w/2, y - h/2, w, h);
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(x - 8, y - 5, 16, 12);
            if (locked) {
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#FFD700';
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.arc(x - 20 + i * 10, y - h/2 - 10 - Math.sin(gameTime/10 + i) * 5, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // ============ EXPLORADORES ============
        let expWalk = 0;

        function drawExplorer(x, y, type, facing = 1, moving = false) {
            expWalk = moving ? Math.sin(gameTime * 0.35) : 0;
            const bob = moving ? -Math.abs(Math.cos(gameTime * 0.35)) * 1.5 : 0;
            ctx.save();
            ctx.translate(x, y + bob);
            ctx.scale(PLAYER_SCALE * facing, PLAYER_SCALE);
            drawExplorerType(0, 0, type);
            ctx.restore();
        }

        function drawExplorerType(x, y, type) {
            switch(type) {
                case 'classic': drawClassicExplorer(x, y); break;
                case 'indiana': drawIndianaExplorer(x, y); break;
                case 'archaeologist': drawArchaeologistExplorer(x, y); break;
                case 'adventurer': drawAdventurerExplorer(x, y); break;
                case 'pharaoh': drawPharaohExplorer(x, y); break;
                case 'cleopatra': drawCleopatraExplorer(x, y); break;
                case 'anubis': drawAnubisExplorer(x, y); break;
            }
        }

        // --- Piezas comunes ---
        function rrFill(x, y, w, h, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            ctx.fill();
        }

        function drawExpLegs(x, y, color, bootColor) {
            const s = expWalk * 4;
            rrFill(x - 7 + s, y + 8, 6, 14, 2.5, color);
            rrFill(x + 1 - s, y + 8, 6, 14, 2.5, color);
            rrFill(x - 7 + s, y + 20, 8, 5, 2, bootColor);
            rrFill(x + 1 - s, y + 20, 8, 5, 2, bootColor);
        }

        function drawExpArms(x, y, sleeve, skin) {
            const s = expWalk * 3;
            rrFill(x - 14, y - 6 + s, 6, 11, 3, sleeve);
            rrFill(x + 8, y - 6 - s, 6, 11, 3, sleeve);
            drawCircle(x - 11, y + 6 + s, 3, skin);
            drawCircle(x + 11, y + 6 - s, 3, skin);
        }

        function drawExpFace(x, y, skin, mouth = '#8D5524') {
            drawCircle(x, y - 20, 12, skin);
            // Orejita
            drawCircle(x - 11, y - 20, 2.5, skin);
            // Ojos con brillo
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(x - 3, y - 22, 3, 0, Math.PI * 2);
            ctx.arc(x + 5, y - 22, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2B1B0E';
            ctx.beginPath();
            ctx.arc(x - 2.2, y - 22, 1.5, 0, Math.PI * 2);
            ctx.arc(x + 5.8, y - 22, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(x - 1.7, y - 22.6, 0.6, 0, Math.PI * 2);
            ctx.arc(x + 6.3, y - 22.6, 0.6, 0, Math.PI * 2);
            ctx.fill();
            // Nariz
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath(); ctx.arc(x + 1.5, y - 18.5, 1.3, 0, Math.PI * 2); ctx.fill();
            // Sonrisa
            ctx.strokeStyle = mouth;
            ctx.lineWidth = 1.6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(x + 1, y - 16.5, 4, 0.2 * Math.PI, 0.8 * Math.PI);
            ctx.stroke();
        }

        // --- Clásico: explorador de safari con salacot ---
        function drawClassicExplorer(x, y) {
            drawExpLegs(x, y, '#8A7A4E', '#5D4037');
            rrFill(x - 8, y - 9, 16, 19, 4, '#B3A268');
            // Bolsillos y botones
            ctx.fillStyle = '#968550';
            ctx.fillRect(x - 6, y - 3, 5, 4);
            ctx.fillRect(x + 1, y - 3, 5, 4);
            ctx.fillStyle = '#4E3620';
            ctx.fillRect(x - 0.7, y - 8, 1.4, 14);
            // Prismáticos colgados
            ctx.strokeStyle = '#4E3620';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x - 6, y - 9);
            ctx.quadraticCurveTo(x, y - 2, x + 6, y - 9);
            ctx.stroke();
            ctx.fillStyle = '#333';
            ctx.fillRect(x - 3.5, y - 4, 3, 4.5);
            ctx.fillRect(x + 0.5, y - 4, 3, 4.5);
            drawExpArms(x, y, '#B3A268', '#FFDBAC');
            drawExpFace(x, y, '#FFDBAC');
            // Salacot
            ctx.fillStyle = '#D9C79A';
            ctx.beginPath();
            ctx.ellipse(x, y - 28, 16, 4.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x, y - 29, 11, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#B7A377';
            ctx.fillRect(x - 11, y - 31, 22, 3);
        }

        // --- Indiana: fedora, chaqueta de cuero, látigo y zurrón ---
        function drawIndianaExplorer(x, y) {
            drawExpLegs(x, y, '#5D4037', '#3E2723');
            // Chaqueta de cuero
            rrFill(x - 8, y - 9, 16, 19, 4, '#6D4C2F');
            // Camisa asomando
            ctx.fillStyle = '#F5F0DC';
            ctx.beginPath();
            ctx.moveTo(x - 3, y - 9);
            ctx.lineTo(x + 3, y - 9);
            ctx.lineTo(x, y + 2);
            ctx.closePath();
            ctx.fill();
            // Solapas
            ctx.strokeStyle = '#4E3620';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(x - 3, y - 9); ctx.lineTo(x - 6, y - 1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + 3, y - 9); ctx.lineTo(x + 6, y - 1); ctx.stroke();
            // Correa del zurrón
            ctx.strokeStyle = '#8D6E43';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x - 7, y - 8);
            ctx.lineTo(x + 7, y + 5);
            ctx.stroke();
            // Cinturón con hebilla
            rrFill(x - 8, y + 6, 16, 4, 1, '#3E2723');
            ctx.fillStyle = '#D4AF37';
            ctx.fillRect(x - 2, y + 6.5, 4, 3);
            // Látigo enrollado en la cadera
            ctx.strokeStyle = '#8B5A2B';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(x - 10, y + 9, 4.2, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(x - 10, y + 9, 2, 0, Math.PI * 2); ctx.stroke();
            drawExpArms(x, y, '#6D4C2F', '#FFDBAC');
            drawExpFace(x, y, '#FFDBAC');
            // Barba incipiente
            ctx.fillStyle = 'rgba(78,54,32,0.22)';
            ctx.beginPath();
            ctx.ellipse(x + 0.5, y - 14, 7, 4, 0, 0, Math.PI);
            ctx.fill();
            // Fedora: ala, copa con pliegue y cinta
            ctx.fillStyle = '#5D4630';
            ctx.beginPath();
            ctx.ellipse(x, y - 29, 17, 4.5, 0, 0, Math.PI * 2);
            ctx.fill();
            rrFill(x - 10, y - 40, 20, 12, 4, '#6B5138');
            ctx.fillStyle = '#3E2E1E';
            ctx.fillRect(x - 10, y - 31.5, 20, 3.5);
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x - 4, y - 39);
            ctx.quadraticCurveTo(x, y - 36, x + 4, y - 39);
            ctx.stroke();
        }

        // --- Arqueóloga: chaleco, gafas, coleta y pincel ---
        function drawArchaeologistExplorer(x, y) {
            drawExpLegs(x, y, '#4682B4', '#5D4037');
            rrFill(x - 8, y - 9, 16, 19, 4, '#FFFFFF');
            rrFill(x - 8, y - 9, 5.5, 19, 2, '#C8A05A');
            rrFill(x + 2.5, y - 9, 5.5, 19, 2, '#C8A05A');
            // Pincel en el cinturón
            ctx.strokeStyle = '#8B5A2B';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x + 6, y + 6); ctx.lineTo(x + 9, y); ctx.stroke();
            ctx.fillStyle = '#DAA520';
            ctx.fillRect(x + 8, y - 3.5, 3.5, 4);
            drawExpArms(x, y, '#FFFFFF', '#FFDBAC');
            drawExpFace(x, y, '#FFDBAC');
            // Coleta
            ctx.fillStyle = '#6B4423';
            ctx.beginPath();
            ctx.ellipse(x - 12, y - 15, 3.5, 7, 0.4, 0, Math.PI * 2);
            ctx.fill();
            // Gafas redondas
            ctx.strokeStyle = '#4E342E';
            ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.arc(x - 3, y - 22, 4, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(x + 5, y - 22, 4, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + 0.7, y - 22.5); ctx.lineTo(x + 1.3, y - 22.5); ctx.stroke();
            // Sombrero de ala ancha
            ctx.fillStyle = '#8B5E34';
            ctx.beginPath();
            ctx.ellipse(x, y - 28.5, 16, 4.5, 0, 0, Math.PI * 2);
            ctx.fill();
            rrFill(x - 9, y - 38, 18, 11, 4, '#9C6B3C');
            ctx.fillStyle = '#E07A5F';
            ctx.fillRect(x - 9, y - 30.5, 18, 3);
        }

        // --- Aventurero: pañuelo rojo y mochila ---
        function drawAdventurerExplorer(x, y) {
            drawExpLegs(x, y, '#8B7355', '#4E342E');
            // Mochila asomando por detrás
            rrFill(x - 13, y - 8, 6, 13, 3, '#A0522D');
            rrFill(x - 8, y - 9, 16, 19, 4, '#5B7431');
            // Correas
            ctx.strokeStyle = '#3E2E1E';
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(x - 5, y - 9); ctx.lineTo(x - 5, y + 5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + 5, y - 9); ctx.lineTo(x + 5, y + 5); ctx.stroke();
            drawExpArms(x, y, '#5B7431', '#E8B98B');
            drawExpFace(x, y, '#E8B98B');
            // Pelo
            ctx.fillStyle = '#3E2723';
            ctx.beginPath();
            ctx.arc(x, y - 23, 11.5, Math.PI * 1.02, Math.PI * 1.98);
            ctx.fill();
            // Pañuelo rojo con nudo
            ctx.fillStyle = '#D32F2F';
            ctx.beginPath();
            ctx.moveTo(x - 12, y - 27);
            ctx.quadraticCurveTo(x, y - 34, x + 12, y - 27);
            ctx.lineTo(x + 10, y - 23);
            ctx.quadraticCurveTo(x, y - 29, x - 10, y - 23);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath(); ctx.arc(x - 11, y - 25, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#B71C1C';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x - 12, y - 24); ctx.lineTo(x - 16, y - 18); ctx.stroke();
        }

        // --- Faraón: nemes azul y oro, collar y cobra ---
        function drawPharaohExplorer(x, y) {
            drawExpLegs(x, y, '#F5F0DC', '#C9A227');
            rrFill(x - 8, y - 9, 16, 19, 4, '#F7F3E3');
            // Faldón dorado
            rrFill(x - 2.5, y - 1, 5, 12, 1.5, '#E6B422');
            // Collar
            ctx.fillStyle = '#E6B422';
            ctx.beginPath();
            ctx.ellipse(x, y - 8, 9, 5, 0, 0, Math.PI);
            ctx.fill();
            ctx.strokeStyle = '#1E56B0';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.ellipse(x, y - 8, 6, 3.2, 0, 0, Math.PI);
            ctx.stroke();
            drawExpArms(x, y, '#D2691E', '#D2691E');
            // Brazaletes
            ctx.fillStyle = '#E6B422';
            ctx.fillRect(x - 14, y + 1, 6, 2.5);
            ctx.fillRect(x + 8, y + 1, 6, 2.5);
            drawExpFace(x, y, '#D2691E', '#5C2E0D');
            // Nemes
            ctx.fillStyle = '#2456C4';
            ctx.beginPath();
            ctx.moveTo(x - 13, y - 29);
            ctx.quadraticCurveTo(x, y - 40, x + 13, y - 29);
            ctx.lineTo(x + 13, y - 11);
            ctx.lineTo(x + 8, y - 11);
            ctx.lineTo(x + 9, y - 25);
            ctx.quadraticCurveTo(x, y - 33, x - 9, y - 25);
            ctx.lineTo(x - 8, y - 11);
            ctx.lineTo(x - 13, y - 11);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#E6B422';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x - 12, y - 27);
            ctx.quadraticCurveTo(x, y - 37, x + 12, y - 27);
            ctx.stroke();
            ctx.fillStyle = '#E6B422';
            ctx.fillRect(x - 13, y - 15, 5, 2.5);
            ctx.fillRect(x + 8, y - 15, 5, 2.5);
            // Cobra en la frente
            ctx.beginPath(); ctx.arc(x, y - 33, 2.3, 0, Math.PI * 2); ctx.fill();
        }

        // --- Cleopatra: melena egipcia, diadema y kohl ---
        function drawCleopatraExplorer(x, y) {
            drawExpLegs(x, y, '#F7F3E3', '#C9A227');
            rrFill(x - 8, y - 9, 16, 19, 4, '#F7F3E3');
            ctx.fillStyle = '#8E44AD';
            ctx.fillRect(x - 8, y + 3, 16, 4);
            ctx.fillStyle = '#E6B422';
            ctx.beginPath();
            ctx.ellipse(x, y - 8, 9, 5, 0, 0, Math.PI);
            ctx.fill();
            drawExpArms(x, y, '#D2691E', '#D2691E');
            ctx.fillStyle = '#E6B422';
            ctx.fillRect(x - 14, y + 1, 6, 2.5);
            ctx.fillRect(x + 8, y + 1, 6, 2.5);
            drawExpFace(x, y, '#D2691E', '#8E2C48');
            // Kohl (delineado egipcio)
            ctx.strokeStyle = '#161616';
            ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(x + 0.5, y - 22); ctx.lineTo(x + 2.5, y - 23); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + 8.5, y - 22); ctx.lineTo(x + 10.5, y - 23); ctx.stroke();
            // Melena negra egipcia
            ctx.fillStyle = '#161616';
            ctx.beginPath();
            ctx.moveTo(x - 13, y - 28);
            ctx.quadraticCurveTo(x, y - 38, x + 13, y - 28);
            ctx.lineTo(x + 12, y - 9);
            ctx.lineTo(x + 7.5, y - 9);
            ctx.lineTo(x + 8.5, y - 25);
            ctx.quadraticCurveTo(x, y - 31, x - 8.5, y - 25);
            ctx.lineTo(x - 7.5, y - 9);
            ctx.lineTo(x - 12, y - 9);
            ctx.closePath();
            ctx.fill();
            // Flequillo
            ctx.fillRect(x - 9, y - 30, 18, 3.5);
            // Diadema dorada con gema
            ctx.fillStyle = '#E6B422';
            ctx.fillRect(x - 12.5, y - 31.5, 25, 2.5);
            ctx.beginPath(); ctx.arc(x + 1, y - 32.5, 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1E9E7B';
            ctx.beginPath(); ctx.arc(x + 1, y - 32.5, 1, 0, Math.PI * 2); ctx.fill();
        }

        // --- Anubis: chacal negro con detalles dorados ---
        function drawAnubisExplorer(x, y) {
            drawExpLegs(x, y, '#2F4F4F', '#1C1C1C');
            rrFill(x - 8, y - 9, 16, 19, 4, '#1C1C1C');
            rrFill(x - 2, y - 2, 4, 13, 1, '#E6B422');
            ctx.fillStyle = '#E6B422';
            ctx.beginPath();
            ctx.ellipse(x, y - 8, 9, 5, 0, 0, Math.PI);
            ctx.fill();
            drawExpArms(x, y, '#1C1C1C', '#2B2B2B');
            // Cabeza de chacal
            ctx.fillStyle = '#1C1C1C';
            ctx.beginPath();
            ctx.ellipse(x, y - 21, 10, 9, 0, 0, Math.PI * 2);
            ctx.fill();
            // Hocico
            ctx.beginPath();
            ctx.ellipse(x + 10, y - 18, 7, 4, -0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#E6B422';
            ctx.beginPath(); ctx.arc(x + 16, y - 19.5, 1.4, 0, Math.PI * 2); ctx.fill();
            // Orejas altas con interior dorado
            ctx.fillStyle = '#1C1C1C';
            ctx.beginPath();
            ctx.moveTo(x - 8, y - 26); ctx.lineTo(x - 10, y - 42); ctx.lineTo(x - 1, y - 28);
            ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + 2, y - 28); ctx.lineTo(x + 5, y - 43); ctx.lineTo(x + 10, y - 26);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#E6B422';
            ctx.beginPath();
            ctx.moveTo(x - 7.5, y - 29); ctx.lineTo(x - 9, y - 38); ctx.lineTo(x - 4, y - 30);
            ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + 3.5, y - 30); ctx.lineTo(x + 5.5, y - 39); ctx.lineTo(x + 8.5, y - 29);
            ctx.closePath(); ctx.fill();
            // Ojo dorado
            ctx.beginPath(); ctx.arc(x + 3, y - 23, 2.2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1C1C1C';
            ctx.beginPath(); ctx.arc(x + 3.8, y - 23, 1, 0, Math.PI * 2); ctx.fill();
        }

        function drawPlayer() {
            const x = player.x - cameraX;
            const y = player.y;
            if (player.invincible && Math.floor(Date.now() / 100) % 2 === 0) return;
            if (player.velocityX > 0.1) player.facing = 1;
            else if (player.velocityX < -0.1) player.facing = -1;
            const moving = Math.abs(player.velocityX) > 0.1 && player.onGround;
            drawExplorer(x, y, gameData.currentExplorer, player.facing || 1, moving);
        }

        function drawKeypad() {
            // Overlay oscuro
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, 1000, 700);

            keypadButtons = [];
            const div = currentTemple.division;
            const needsRemainder = gameData.currentLevel >= 7;

            // Panel principal con estilo egipcio
            const panelX = 200, panelY = 80, panelW = 600, panelH = 540;
            
            // Fondo del panel con gradiente dorado
            const gradient = ctx.createLinearGradient(panelX, panelY, panelX, panelY + panelH);
            gradient.addColorStop(0, '#8B4513');
            gradient.addColorStop(0.3, '#D2691E');
            gradient.addColorStop(0.7, '#CD853F');
            gradient.addColorStop(1, '#8B4513');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(panelX, panelY, panelW, panelH, 20);
            ctx.fill();

            // Borde dorado
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Decoración egipcia superior
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(panelX + 50, panelY + 10, panelW - 100, 4);
            ctx.fillRect(panelX + 80, panelY + 18, panelW - 160, 2);

            // Título
            drawText('🏺 DIVISIÓN 🏺', 500, panelY + 55, 32, '#FFD700', 'center', true);

            // División a resolver
            drawText(`${div[0]} ÷ ${div[1]} = ?`, 500, panelY + 110, 48, '#FFF', 'center', true);

            // Caja de respuesta
            const inputX = 300, inputY = panelY + 140, inputW = 400, inputH = 55;
            drawRect(inputX, inputY, inputW, inputH, '#FFF8DC', '#8B4513', 12);
            drawText(playerAnswer || '...', 500, inputY + inputH/2, 36, playerAnswer ? '#333' : '#999', 'center');

            if (needsRemainder) {
                drawText('(cociente + resto, ej: 6r1 = 61)', 500, inputY + inputH + 20, 16, '#FFE4B5', 'center');
            }

            // Teclado numérico
            const numStartY = inputY + inputH + (needsRemainder ? 45 : 25);
            const btnSize = 65;
            const gap = 12;
            const numStartX = 500 - (5 * btnSize + 4 * gap) / 2;

            // Fila 1: 1-5
            for (let i = 1; i <= 5; i++) {
                const bx = numStartX + (i - 1) * (btnSize + gap);
                const by = numStartY;
                drawNumButton(bx, by, btnSize, btnSize, i.toString());
                keypadButtons.push({ x: bx, y: by, w: btnSize, h: btnSize, action: 'number', value: i.toString() });
            }

            // Fila 2: 6-0
            for (let i = 6; i <= 10; i++) {
                const bx = numStartX + (i - 6) * (btnSize + gap);
                const by = numStartY + btnSize + gap;
                const num = i === 10 ? '0' : i.toString();
                drawNumButton(bx, by, btnSize, btnSize, num);
                keypadButtons.push({ x: bx, y: by, w: btnSize, h: btnSize, action: 'number', value: num });
            }

            // Fila 3: Borrar, Aceptar, Cancelar
            const actionY = numStartY + 2 * (btnSize + gap) + 15;

        function handleKeypadClick(x, y) {
            // Calcular posiciones de botones directamente (igual que en drawKeypad)
            const panelY = 80;
            const needsRemainder = gameData.currentLevel >= 7;
            const inputY = panelY + 140;
            const inputH = 55;
            const numStartY = inputY + inputH + (needsRemainder ? 45 : 25);
            const btnSize = 65;
            const gap = 12;
            const numStartX = 500 - (5 * btnSize + 4 * gap) / 2;
            
            // Verificar botones numéricos fila 1 (1-5)
            for (let i = 1; i <= 5; i++) {
                const bx = numStartX + (i - 1) * (btnSize + gap);
                const by = numStartY;
                if (x >= bx && x <= bx + btnSize && y >= by && y <= by + btnSize) {
                    playSound(400, 500, 0.1);
                    if (playerAnswer.length < 5) playerAnswer += i.toString();
                    return;
                }
            }
            
            // Verificar botones numéricos fila 2 (6-0)
            for (let i = 6; i <= 10; i++) {
                const bx = numStartX + (i - 6) * (btnSize + gap);
                const by = numStartY + btnSize + gap;
                if (x >= bx && x <= bx + btnSize && y >= by && y <= by + btnSize) {
                    playSound(400, 500, 0.1);
                    const num = i === 10 ? '0' : i.toString();
                    if (playerAnswer.length < 5) playerAnswer += num;
                    return;
                }
            }
            
            // Verificar botones de acción
            const actionY = numStartY + 2 * (btnSize + gap) + 15;
            const actionW = 150;
            const actionH = 55;
            const actionGap = 30;
            const actionStartX = 500 - (3 * actionW + 2 * actionGap) / 2;
            
            // Botón Borrar
            if (x >= actionStartX && x <= actionStartX + actionW && 
                y >= actionY && y <= actionY + actionH) {
                playSound(400, 500, 0.1);
                playerAnswer = playerAnswer.slice(0, -1);
                return;
            }
            
            // Botón OK
            const okX = actionStartX + actionW + actionGap;
            if (x >= okX && x <= okX + actionW && 
                y >= actionY && y <= actionY + actionH) {
                playSound(400, 500, 0.1);
                submitAnswer();
                return;
            }
            
            // Botón Salir
            const cancelX = actionStartX + 2 * (actionW + actionGap);
            if (x >= cancelX && x <= cancelX + actionW && 
                y >= actionY && y <= actionY + actionH) {
                playSound(300, 200, 0.1);
                playerAnswer = '';
                showingKeypad = false;
                isChestQuestion = false;
                return;
            }
        }

        function submitAnswer() {
            if (!playerAnswer) return;

            const div = currentTemple.division;
            const correctAnswer = Math.floor(div[0] / div[1]);
            const remainder = div[0] % div[1];
            const needsRemainder = gameData.currentLevel >= 7;

            let isCorrect = false;
            if (needsRemainder && remainder > 0) {
                const expectedAnswer = correctAnswer.toString() + remainder.toString();
                isCorrect = playerAnswer === expectedAnswer;
            } else {
                isCorrect = parseInt(playerAnswer) === correctAnswer;
            }

            if (isCorrect) {
                playSound(523, 784, 0.3);
                gameData.coins += 2;
                
                // Si es el cofre, desbloquearlo
                if (isChestQuestion) {
                    treasureChest.locked = false;
                    gameData.coins += 5; // Bonus por abrir el cofre
                } else {
                    gameData.divisionsCorrect++;
                    currentTemple.solved = true;
                }
            } else {
                playSound(200, 150, 0.3);
                gameData.coins = Math.max(0, gameData.coins - 1);
            }

            playerAnswer = '';
            showingKeypad = false;
            isChestQuestion = false;
        }

        // ============ FONDO DESIERTO ============
        function drawDesertScene(pcam) {
            // Cielo
            const sky = ctx.createLinearGradient(0, 0, 0, 660);
            sky.addColorStop(0, '#5EB3E4');
            sky.addColorStop(0.45, '#9FD4F0');
            sky.addColorStop(0.75, '#FFE3B3');
            sky.addColorStop(1, '#F6C98F');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, 1000, 700);

            // Sol con halo
            const glow = ctx.createRadialGradient(860, 105, 10, 860, 105, 130);
            glow.addColorStop(0, 'rgba(255, 236, 160, 0.9)');
            glow.addColorStop(1, 'rgba(255, 236, 160, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(720, -30, 280, 280);
            drawCircle(860, 105, 42, '#FFD760');
            drawCircle(860, 105, 34, '#FFE99A');

            // Pájaros lejanos
            ctx.strokeStyle = 'rgba(90, 70, 50, 0.45)';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
                const bx = ((gameTime * 0.4 + i * 300) % 1200) - 100;
                const by = 85 + i * 38 + Math.sin(gameTime * 0.05 + i * 2) * 6;
                ctx.beginPath();
                ctx.moveTo(bx - 7, by);
                ctx.quadraticCurveTo(bx - 3, by - 5, bx, by);
                ctx.quadraticCurveTo(bx + 3, by - 5, bx + 7, by);
                ctx.stroke();
            }

            // Pirámides lejanas (parallax lento)
            const p1 = pcam * 0.15;
            for (let i = -1; i < 3; i++) {
                const base = i * 850 - ((p1 % 850) + 850) % 850;
                drawPyramidSilhouette(base + 180, 545, 280, 175);
            }

            // Bruma cálida del horizonte
            const haze = ctx.createLinearGradient(0, 470, 0, 555);
            haze.addColorStop(0, 'rgba(255, 231, 190, 0)');
            haze.addColorStop(1, 'rgba(255, 231, 190, 0.75)');
            ctx.fillStyle = haze;
            ctx.fillRect(0, 470, 1000, 85);

            // Dunas intermedias
            const p2 = pcam * 0.4;
            ctx.fillStyle = '#EBCB98';
            ctx.beginPath();
            ctx.moveTo(-5, 700);
            for (let sx = -5; sx <= 1005; sx += 20) {
                const wx = sx + p2;
                ctx.lineTo(sx, 560 + Math.sin(wx * 0.004) * 26 + Math.sin(wx * 0.0013) * 16);
            }
            ctx.lineTo(1005, 700);
            ctx.closePath();
            ctx.fill();

            // Palmeras
            const p3 = pcam * 0.6;
            for (let i = -1; i < 4; i++) {
                const px = i * 640 - ((p3 % 640) + 640) % 640 + 110;
                drawPalm(px, 632, 0.85 + (((i % 3) + 3) % 3) * 0.15);
            }

            // Duna cercana
            ctx.fillStyle = '#E2BC85';
            ctx.beginPath();
            ctx.moveTo(-5, 700);
            for (let sx = -5; sx <= 1005; sx += 20) {
                const wx = sx + pcam * 0.75;
                ctx.lineTo(sx, 622 + Math.sin(wx * 0.006 + 2) * 14);
            }
            ctx.lineTo(1005, 700);
            ctx.closePath();
            ctx.fill();
        }

        function drawPyramidSilhouette(x, baseY, w, h) {
            // Cara iluminada
            ctx.fillStyle = '#E9C795';
            ctx.beginPath();
            ctx.moveTo(x - w / 2, baseY);
            ctx.lineTo(x, baseY - h);
            ctx.lineTo(x + w * 0.12, baseY);
            ctx.closePath();
            ctx.fill();
            // Cara en sombra
            ctx.fillStyle = '#CFA872';
            ctx.beginPath();
            ctx.moveTo(x + w * 0.12, baseY);
            ctx.lineTo(x, baseY - h);
            ctx.lineTo(x + w / 2, baseY);
            ctx.closePath();
            ctx.fill();
            // Pirámide pequeña acompañante
            ctx.fillStyle = '#EDD2A3';
            ctx.beginPath();
            ctx.moveTo(x + w * 0.55, baseY);
            ctx.lineTo(x + w * 0.75, baseY - h * 0.55);
            ctx.lineTo(x + w * 0.95, baseY);
            ctx.closePath();
            ctx.fill();
        }

        function drawPalm(x, baseY, s) {
            ctx.save();
            ctx.translate(x, baseY);
            ctx.scale(s, s);
            // Tronco curvado
            ctx.strokeStyle = '#8B6239';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(10, -45, 22, -78);
            ctx.stroke();
            // Hojas
            ctx.strokeStyle = '#4E8C3A';
            ctx.lineWidth = 5;
            const tx = 22, ty = -78;
            const angles = [-2.7, -2.1, -1.45, -0.7, 0, 0.6];
            angles.forEach(a => {
                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.quadraticCurveTo(tx + Math.cos(a) * 22, ty + Math.sin(a) * 22 - 14,
                                     tx + Math.cos(a) * 44, ty + Math.sin(a) * 30 + 8);
                ctx.stroke();
            });
            // Cocos
            ctx.fillStyle = '#6B4A2B';
            ctx.beginPath(); ctx.arc(tx - 4, ty + 4, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(tx + 4, ty + 5, 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawDesertGround(pcam) {
            const ground = ctx.createLinearGradient(0, 648, 0, 700);
            ground.addColorStop(0, '#F2D6A4');
            ground.addColorStop(1, '#D9B37E');
            ctx.fillStyle = ground;
            ctx.fillRect(0, 650, 1000, 50);
            ctx.fillStyle = 'rgba(255, 248, 226, 0.7)';
            ctx.fillRect(0, 650, 1000, 3);
            // Piedras y matojos deterministas
            for (let i = 0; i < 70; i++) {
                const wx = (i * 137.7) % 4200;
                const sx = wx - pcam;
                if (sx < -20 || sx > 1020) continue;
                const wy = 662 + ((i * 53) % 30);
                if (i % 4 === 0) {
                    ctx.strokeStyle = '#B99B60';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(sx, wy); ctx.lineTo(sx - 3, wy - 6);
                    ctx.moveTo(sx, wy); ctx.lineTo(sx, wy - 7);
                    ctx.moveTo(sx, wy); ctx.lineTo(sx + 3, wy - 6);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = i % 2 ? '#CBA97A' : '#BF9D6E';
                    ctx.beginPath();
                    ctx.ellipse(sx, wy, 3, 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

            // Controles táctiles: solo en pantallas táctiles, discretos y en

        function drawTouchBtn(cx, cy, r, glyph, active) {
            ctx.save();
            ctx.globalAlpha = active ? 0.95 : 0.45;
            ctx.fillStyle = active ? '#FFC94D' : '#8B5A2B';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.globalAlpha = 1;
            drawText(glyph, cx, cy + 1, 30, '#FFF', 'center');
            ctx.restore();
        }

        function updateGame() {
            gameTime++;

            // Movimiento
            if (keys['ArrowLeft'] || keys['a'] || touchLeft) {
                player.velocityX = -player.speed;
            } else if (keys['ArrowRight'] || keys['d'] || touchRight) {
                player.velocityX = player.speed;
            } else {
                player.velocityX = 0;
            }

            // Salto
            if ((keys['ArrowUp'] || keys['w'] || keys[' '] || touchJump) && player.onGround) {
                player.velocityY = -player.jumpPower;
                player.onGround = false;
            }

            // Física
            player.velocityY += player.gravity;
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Límites
            if (player.x < 30) player.x = 30;
            if (player.x > 3850) player.x = 3850;

            // Suelo
            if (player.y > 610) {
                player.y = 610;
                player.velocityY = 0;
                player.onGround = true;
            }

            // Plataformas
            const platforms = [
                [300, 520], [600, 470], [900, 520], [1200, 440],
                [1500, 520], [1800, 500], [2100, 520], [2400, 460],
                [2700, 520], [3000, 480], [3300, 450]
            ];
            platforms.forEach(([px, py]) => {
                if (player.x > px - 20 && player.x < px + 170 &&
                    player.y > py - 40 && player.y < py + 10 &&
                    player.velocityY > 0) {
                    player.y = py - 35;
                    player.velocityY = 0;
                    player.onGround = true;
                }
            });

            // Cámara
            const targetCameraX = player.x - 400;
            cameraX += (targetCameraX - cameraX) * 0.1;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > 2900) cameraX = 2900;

            // Trampas
            traps.forEach(trap => {
                trap.timer++;
                if (trap.timer > 120) {
                    trap.extended = !trap.extended;
                    trap.timer = 0;
                }
                if (trap.extended && !player.invincible) {
                    if (Math.abs(player.x - trap.x) < 40 && player.y > 580) {
                        gameData.lives--;
                        player.invincible = true;
                        player.invincibleTimer = 90;
                        player.velocityY = -10;
                        playSound(150, 100, 0.3);
                        if (gameData.lives <= 0) {
                            gameData.scene = 'gameover';
                        }
                    }
                }
            });

            // Escorpiones
            scorpions.forEach(s => {
                if (s.active) {
                    s.x += s.velocityX * s.direction;
                    if (s.x < 600 || s.x > 2200) s.direction *= -1;

                    if (!player.invincible) {
                        const dx = Math.abs(player.x - s.x);
                        const dy = Math.abs(player.y - s.y);
                        if (dx < 40 && dy < 50) {
                            if (player.velocityY > 0 && player.y < s.y - 20) {
                                s.active = false;
                                gameData.coins += 1;
                                player.velocityY = -10;
                                playSound(523, 784, 0.2);
                            } else {
                                gameData.lives--;
                                player.invincible = true;
                                player.invincibleTimer = 120;
                                player.x -= 80 * s.direction;
                                playSound(150, 100, 0.3);
                                if (gameData.lives <= 0) {
                                    gameData.scene = 'gameover';
                                }
                            }
                        }
                    }
                }
            });

            // Momia
            if (gameData.divisionsCorrect >= 10 && mummy.active) {
                mummy.x += mummy.velocityX * mummy.direction;
                if (mummy.x < 3250 || mummy.x > 3750) mummy.direction *= -1;

                if (!player.invincible) {
                    const dx = Math.abs(player.x - mummy.x);
                    const dy = Math.abs(player.y - mummy.y);
                    if (dx < 50 && dy < 60) {
                        gameData.lives--;
                        player.invincible = true;
                        player.invincibleTimer = 120;
                        player.x -= 100;
                        playSound(100, 80, 0.5);
                        if (gameData.lives <= 0) {
                            gameData.scene = 'gameover';
                        }
                    }
                }
            }

            if (player.invincible) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0) player.invincible = false;
            }

            // Colisión con pirámides
            if (!showingKeypad) {
                temples.forEach(temple => {
                    if (!temple.solved && Math.abs(player.x - temple.x) < 80 && Math.abs(player.y - temple.y) < 80) {
                        showingKeypad = true;
                        currentTemple = temple;
                        playerAnswer = '';
                    }
                });
            }

            // Colisión con cofre
            if (gameData.divisionsCorrect >= 10 && treasureChest.locked) {
                if (Math.abs(player.x - treasureChest.x) < 60 && Math.abs(player.y - treasureChest.y) < 50) {
                    if (!showingKeypad) {
                        showingKeypad = true;
                        isChestQuestion = true;
                        currentTemple = { division: treasureChest.division, solved: false };
                        playerAnswer = '';
                    }
                }
            }

            // Victoria
            if (gameData.divisionsCorrect >= 10 && !treasureChest.locked && player.x > 3800) {
                gameData.scene = 'victory';
            }
        }

        function drawVictory() {
            const gradient = ctx.createLinearGradient(0, 0, 0, 700);
            gradient.addColorStop(0, '#FFD700');
            gradient.addColorStop(1, '#FFA500');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1000, 700);

            drawText('🏆 ¡NIVEL COMPLETADO! 🏆', 500, 150, 48, '#8B4513', 'center', true);
            drawText(`💰 Monedas: ${gameData.coins}`, 500, 270, 32, '#654321', 'center');
            drawText(`❤️ Vidas: ${gameData.lives}`, 500, 320, 32, '#DC143C', 'center');

            if (gameData.currentLevel === gameData.unlockedLevels && gameData.currentLevel < 9) {
                gameData.unlockedLevels++;
                drawText(`🔓 Nivel ${gameData.unlockedLevels} desbloqueado`, 500, 380, 24, '#27ae60', 'center');
            }

            const buttons = [];
            const shopBtn = drawButton(325, 450, 350, 60, '🏺 TIENDA', '#D35400');
            buttons.push({ ...shopBtn, action: 'shop' });

            const menuBtn = drawButton(325, 530, 350, 60, '🏠 MENÚ', '#E67E22');
            buttons.push({ ...menuBtn, action: 'menu' });

            return buttons;
        }

        function drawGameOver() {
            drawRect(0, 0, 1000, 700, '#2C3E50');
            drawText('💀 GAME OVER 💀', 500, 200, 54, '#e74c3c', 'center', true);
            drawText('¡Te quedaste sin vidas!', 500, 280, 28, '#ECF0F1', 'center');
            drawText(`💰 ${gameData.coins}`, 500, 340, 24, '#FFD700', 'center');

            const buttons = [];
            const retryBtn = drawButton(325, 420, 350, 60, '🔄 REINTENTAR', '#E67E22');
            buttons.push({ ...retryBtn, action: 'retry' });

            const menuBtn = drawButton(325, 500, 350, 60, '🏠 MENÚ', '#95A5A6');
            buttons.push({ ...menuBtn, action: 'menu' });

            return buttons;
        }

        function drawShop() {
            const gradient = ctx.createLinearGradient(0, 0, 0, 700);
            gradient.addColorStop(0, '#FBEED2');
            gradient.addColorStop(0.6, '#F2D9A8');
            gradient.addColorStop(1, '#E4C289');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1000, 700);

            drawText('🏺 TIENDA', 500, 50, 40, '#8B4513', 'center');
            drawText(`💰 ${gameData.coins}`, 500, 100, 28, '#B8860B', 'center');

            const buttons = [];

            explorers.forEach((explorer, index) => {
                const row = Math.floor(index / 4);
                const col = index % 4;
                const x = 80 + col * 230;
                const y = 150 + row * 200;

                drawRect(x, y, 200, 170, 'rgba(255,255,255,0.65)', '#C9932B', 15);

                // Explorador miniatura
                ctx.save();
                const mx = x + 100, my = y + 70;
                ctx.translate(mx, my);
                ctx.scale(1.2, 1.2);
                ctx.translate(-mx, -my);
                expWalk = 0;
                drawExplorerType(mx, my, explorer.id);
                ctx.restore();

                drawText(explorer.name, x + 100, y + 120, 16, '#5D4037', 'center');

                const owned = gameData.ownedExplorers.includes(explorer.id);
                const equipped = gameData.currentExplorer === explorer.id;
                const canAfford = gameData.coins >= explorer.price;

                if (equipped) {
                    drawButton(x + 25, y + 135, 150, 28, '✓ Equipado', '#27ae60', 14);
                } else if (owned) {
                    const btn = drawButton(x + 25, y + 135, 150, 28, 'Equipar', '#3498db', 14);
                    buttons.push({ ...btn, action: 'equip', explorer: explorer.id });
                } else if (explorer.price === 0) {
                    const btn = drawButton(x + 25, y + 135, 150, 28, 'Gratis', '#27ae60', 14);
                    buttons.push({ ...btn, action: 'buy', explorer: explorer.id, price: 0 });
                } else {
                    const btn = drawButton(x + 25, y + 135, 150, 28, `💰 ${explorer.price}`, canAfford ? '#E67E22' : '#7F8C8D', 14);
                    if (canAfford) buttons.push({ ...btn, action: 'buy', explorer: explorer.id, price: explorer.price });
                }
            });

            const backBtn = drawButton(400, 620, 200, 50, '← Volver', '#95A5A6');
            buttons.push({ ...backBtn, action: 'menu' });

            return buttons;
        }

        function handleClick(x, y) {
            let buttons = [];

            if (gameData.scene === 'menu') buttons = drawMenu();
            else if (gameData.scene === 'victory') buttons = drawVictory();
            else if (gameData.scene === 'shop') buttons = drawShop();
            else if (gameData.scene === 'gameover') buttons = drawGameOver();

            buttons.forEach(btn => {
                if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                    handleAction(btn);
                }
            });
        }

        function handleAction(btn) {
            playSound(300, 400, 0.1);
            
            switch(btn.action) {
                case 'level':
                    gameData.currentLevel = btn.level;
                    gameData.scene = 'game';
                    initGame();
                    break;
                case 'shop':
                    gameData.scene = 'shop';
                    break;
                case 'menu':
                    gameData.scene = 'menu';
                    gameData.lives = 3;
                    break;
                case 'retry':
                    gameData.lives = 3;
                    gameData.scene = 'game';
                    initGame();
                    break;
                case 'buy':
                    gameData.coins -= btn.price;
                    gameData.ownedExplorers.push(btn.explorer);
                    gameData.currentExplorer = btn.explorer;
                    break;
                case 'equip':
                    gameData.currentExplorer = btn.explorer;
                    break;
            }
        }

        // ============ GAME LOOP ============
        function gameLoop() {
            ctx.clearRect(0, 0, 1000, 700);

            if (gameData.scene === 'menu') {
                gameTime++;
                drawMenu();
            } else if (gameData.scene === 'game') {
                if (!showingKeypad) updateGame();
                drawGame();
                if (showingKeypad) drawKeypad();
            } else if (gameData.scene === 'victory') {
                drawVictory();
            } else if (gameData.scene === 'shop') {
                drawShop();
            } else if (gameData.scene === 'gameover') {
                drawGameOver();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw_division.js').catch(() => {});
        }
    </script>
</body>
</html>
